<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS - Battle Redemption</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  --neon:#ff6b35;--neon2:#ffaa00;--purple:#7c3aed;
  --bg:#07091a;--bg2:#0d1230;
  --glass:rgba(255,107,53,0.07);--border:rgba(255,107,53,0.35);
  --white:#fff;--gray:#a0aec0;
  --success:#10b981;--error:#ef4444;--warn:#f59e0b;
  --radius:18px;--radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--white);font-family:'Rajdhani',sans-serif;overflow-x:hidden;min-height:100vh;font-size:16px;}

/* PAGES */
.page{display:none;min-height:100vh;position:relative;}
.page.active{display:flex;flex-direction:column;}

/* LOADING */
#page-loading{align-items:center;justify-content:center;background:linear-gradient(135deg,#07091a,#0d1230);}
.ld-inner{text-align:center;}
.ld-logo{font-family:'Orbitron',sans-serif;font-size:52px;color:var(--neon);text-shadow:0 0 30px var(--neon);letter-spacing:4px;animation:pulse 1.2s ease-in-out infinite;}
.ld-sub{color:var(--gray);font-size:13px;letter-spacing:3px;margin-top:8px;}
.ld-bar{width:220px;height:3px;background:rgba(255,107,53,.15);border-radius:10px;margin:30px auto 0;overflow:hidden;}
.ld-fill{height:100%;background:linear-gradient(90deg,var(--neon),var(--neon2));border-radius:10px;animation:loadbar 2.4s ease-in-out forwards;box-shadow:0 0 12px var(--neon);}
@keyframes loadbar{0%{width:0}60%{width:100%}100%{width:100%}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* AUTH PAGE */
#page-auth{background:linear-gradient(155deg,#07091a 0%,#120828 50%,#07091a 100%);align-items:center;justify-content:center;padding:24px;}
.login-bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;}
.orb-a{width:320px;height:320px;background:var(--neon);top:-80px;right:-80px;animation:orbmove 12s ease-in-out infinite;}
.orb-b{width:260px;height:260px;background:var(--purple);bottom:-60px;left:-60px;animation:orbmove 16s ease-in-out infinite reverse;}
@keyframes orbmove{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,20px)}}
.login-card{background:rgba(13,18,48,0.85);border:1.5px solid var(--border);border-radius:24px;padding:28px 24px 24px;width:100%;max-width:390px;position:relative;z-index:2;backdrop-filter:blur(12px);box-shadow:0 0 50px rgba(255,107,53,.18),inset 0 0 30px rgba(255,107,53,.05);animation:slideup .5s ease;}
@keyframes slideup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.login-logo{text-align:center;margin-bottom:16px;}
.login-logo .big{font-family:'Orbitron',sans-serif;font-size:34px;color:var(--neon);text-shadow:0 0 22px var(--neon);letter-spacing:3px;}
.login-logo .tagline{font-size:11px;color:var(--gray);letter-spacing:2px;margin-top:4px;}
.status-row{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:30px;padding:6px 14px;margin-bottom:16px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pulse 1.8s ease-in-out infinite;}
.status-row span{font-size:11px;color:var(--success);letter-spacing:1px;}

/* AUTH TABS */
.auth-tabs{display:flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:18px;}
.auth-tab{flex:1;background:transparent;border:none;color:var(--gray);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;padding:10px;cursor:pointer;transition:all .25s;}
.auth-tab.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:#fff;}

/* FIELDS */
.field-label{font-size:11px;color:var(--gray);letter-spacing:1px;margin-bottom:5px;display:block;}
.field-wrap{margin-bottom:12px;}
.field-input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,107,53,.25);border-radius:var(--radius-sm);padding:11px 13px;color:var(--white);font-family:'Rajdhani',sans-serif;font-size:14px;outline:none;transition:all .25s;}
.field-input::placeholder{color:rgba(255,255,255,.28);}
.field-input:focus{border-color:var(--neon);background:rgba(255,107,53,.08);box-shadow:0 0 14px rgba(255,107,53,.2);}
.field-hint{font-size:11px;margin-top:4px;}
.field-hint.ok{color:var(--success);}
.field-hint.err{color:var(--error);}

/* PASS STRENGTH */
.pass-strength-wrap{margin-top:6px;display:flex;align-items:center;gap:8px;}
.pass-strength-bar{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;}
.pass-strength-fill{height:100%;border-radius:10px;transition:all .3s;}
.pass-strength-label{font-size:11px;white-space:nowrap;}

/* AUTH MSG */
.auth-msg{font-size:12px;min-height:18px;margin-bottom:8px;text-align:center;transition:all .25s;}
.auth-msg.ok{color:var(--success);}
.auth-msg.err{color:var(--error);}

/* BUTTONS */
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;border-radius:var(--radius);color:#fff;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:4px;box-shadow:0 0 24px rgba(255,107,53,.5);transition:all .25s;position:relative;overflow:hidden;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 0 36px var(--neon);}
.btn-login::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.12),transparent);border-radius:var(--radius);}
.login-note{text-align:center;color:var(--gray);font-size:12px;margin-top:12px;}
.login-note span{color:var(--neon);}

/* MAIN PAGE */
#page-main{background:linear-gradient(155deg,#07091a 0%,#0d1230 100%);flex-direction:column;padding-bottom:90px;}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(7,9,26,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;}
.nav-brand{font-family:'Orbitron',sans-serif;font-size:20px;color:var(--neon);text-shadow:0 0 14px var(--neon);letter-spacing:2px;}
.nav-user{display:flex;align-items:center;gap:10px;}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--neon),var(--purple));display:flex;align-items:center;justify-content:center;font-size:16px;border:2px solid var(--neon);box-shadow:0 0 10px rgba(255,107,53,.4);}
.nav-name{font-size:13px;color:var(--gray);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.btn-logout{background:none;border:1px solid rgba(255,107,53,.3);border-radius:8px;color:var(--neon);padding:5px 10px;font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:1px;transition:all .2s;}
.btn-logout:hover{background:rgba(255,107,53,.1);}

/* HERO */
.hero-strip{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(124,58,237,.12));border-bottom:1px solid var(--border);padding:20px 16px 16px;position:relative;overflow:hidden;}
.hero-strip::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,107,53,.07),transparent);animation:shimmer 3s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.event-pill{display:inline-block;background:var(--warn);color:#000;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:8px;}
.hero-title{font-family:'Orbitron',sans-serif;font-size:19px;color:var(--neon);text-shadow:0 0 16px var(--neon);letter-spacing:1px;margin-bottom:4px;}
.hero-sub{font-size:13px;color:var(--gray);}

/* STATS */
.stats-row{display:flex;gap:10px;padding:14px 16px 0;}
.stat-box{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;}
.stat-val{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--neon);}
.stat-lbl{font-size:10px;color:var(--gray);letter-spacing:1px;margin-top:2px;}

/* COUNTDOWN */
.countdown-wrap{padding:12px 16px 0;}
.countdown-box{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
.cd-label{font-size:12px;color:var(--gray);letter-spacing:1px;}
.cd-nums{display:flex;gap:8px;}
.cd-item{text-align:center;}
.cd-val{font-family:'Orbitron',sans-serif;font-size:18px;color:var(--neon);background:rgba(255,107,53,.1);border:1px solid var(--border);border-radius:8px;padding:2px 6px;display:block;min-width:36px;}
.cd-sub{font-size:9px;color:var(--gray);letter-spacing:1px;margin-top:2px;}

/* SECTIONS */
.section{padding:18px 16px 0;}
.sec-head{margin-bottom:12px;}
.sec-title{font-family:'Orbitron',sans-serif;font-size:15px;color:var(--white);letter-spacing:1.5px;}
.sec-title span{color:var(--neon);}
.sec-sub{font-size:12px;color:var(--gray);margin-top:3px;}

/* REDEEM */
.redeem-box{background:rgba(13,18,48,.7);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 16px;backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(255,107,53,.1);}
.code-row{display:flex;gap:10px;margin-bottom:12px;}
.code-inp{flex:1;background:#fff;border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 12px;color:#111;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:2px;outline:none;transition:all .25s;text-transform:uppercase;}
.code-inp::placeholder{color:#aaa;font-size:11px;letter-spacing:1px;font-family:'Rajdhani',sans-serif;}
.code-inp:focus{border-color:var(--neon);box-shadow:0 0 14px rgba(255,107,53,.3);}
.btn-redeem{background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;border-radius:var(--radius-sm);color:#fff;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;padding:0 16px;cursor:pointer;box-shadow:0 0 18px rgba(255,107,53,.5);transition:all .25s;white-space:nowrap;}
.btn-redeem:hover{transform:translateY(-2px);box-shadow:0 0 28px var(--neon);}
.btn-redeem:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.code-hint{font-size:11px;color:var(--gray);letter-spacing:.5px;margin-bottom:8px;}
.code-hint strong{color:var(--neon);}
.codes-list{display:flex;flex-wrap:wrap;gap:7px;}
.code-chip{background:rgba(255,107,53,.08);border:1px solid rgba(255,107,53,.25);border-radius:20px;padding:4px 10px;font-size:10px;color:var(--neon2);font-family:'Orbitron',sans-serif;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.code-chip:hover{background:rgba(255,107,53,.18);border-color:var(--neon);}
.code-chip:active{transform:scale(.95);}

/* DAILY */
.daily-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none;}
.daily-scroll::-webkit-scrollbar{display:none;}
.daily-card{flex:0 0 88px;background:var(--glass);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 8px;text-align:center;position:relative;transition:all .25s;}
.daily-card.claimed{opacity:.6;}
.daily-card.locked{opacity:.45;}
.day-num{font-size:10px;color:var(--gray);letter-spacing:1px;margin-bottom:5px;}
.day-icon{font-size:26px;margin-bottom:5px;}
.day-name{font-size:11px;color:var(--white);}
.day-badge{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;border-radius:6px;padding:2px 7px;margin-top:5px;}
.badge-claimed{background:rgba(16,185,129,.2);color:var(--success);}
.badge-claim{background:rgba(255,107,53,.25);color:var(--neon);cursor:pointer;}
.badge-locked{background:rgba(160,174,192,.1);color:var(--gray);}

/* SPIN */
.spin-area{text-align:center;}
.wheel-wrap{position:relative;width:210px;height:210px;margin:0 auto 16px;}
.wheel{width:210px;height:210px;border-radius:50%;border:4px solid var(--neon);box-shadow:0 0 28px rgba(255,107,53,.5);position:relative;overflow:hidden;transition:transform 5s cubic-bezier(.25,.46,.45,.94);background:conic-gradient(#ff6b35 0deg 60deg,#7c3aed 60deg 120deg,#ffaa00 120deg 180deg,#10b981 180deg 240deg,#3b82f6 240deg 300deg,#ef4444 300deg 360deg);}
.wheel-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.wheel-center div{width:46px;height:46px;border-radius:50%;background:var(--bg);border:3px solid var(--neon);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2;}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid var(--neon);filter:drop-shadow(0 0 6px var(--neon));}
.btn-spin{display:inline-block;background:linear-gradient(135deg,var(--neon),var(--neon2));border:none;border-radius:var(--radius);color:#fff;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;padding:13px 34px;cursor:pointer;box-shadow:0 0 24px rgba(255,107,53,.5);transition:all .25s;}
.btn-spin:hover{transform:translateY(-2px);box-shadow:0 0 36px var(--neon);}
.btn-spin:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* INVENTORY */
.inv-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:12px;}
.inv-filter::-webkit-scrollbar{display:none;}
.flt-btn{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--gray);cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:1px;transition:all .2s;}
.flt-btn.active{background:rgba(255,107,53,.18);border-color:var(--neon);color:var(--neon);}
.inv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.inv-card{background:var(--glass);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 10px;text-align:center;transition:all .25s;animation:slideup .4s ease;}
.inv-card:hover{transform:translateY(-4px);border-color:var(--neon);}
.inv-icon{font-size:34px;margin-bottom:6px;}
.inv-name{font-size:12px;color:var(--white);font-weight:600;margin-bottom:4px;}
.inv-rarity{font-size:10px;border-radius:6px;padding:2px 8px;display:inline-block;letter-spacing:.5px;}
.rarity-legendary{background:rgba(255,107,53,.2);color:var(--neon);}
.rarity-epic{background:rgba(124,58,237,.2);color:#a78bfa;}
.rarity-rare{background:rgba(59,130,246,.2);color:#60a5fa;}
.rarity-common{background:rgba(160,174,192,.1);color:var(--gray);}
.inv-empty{grid-column:1/-1;text-align:center;padding:36px;color:var(--gray);font-size:13px;}

/* EVENTS */
.event-card{background:var(--glass);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;}
.ev-badge-active{display:inline-block;background:rgba(16,185,129,.2);color:var(--success);border:1px solid rgba(16,185,129,.3);border-radius:6px;font-size:10px;padding:2px 8px;letter-spacing:1px;margin-bottom:8px;}
.ev-badge-soon{display:inline-block;background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3);border-radius:6px;font-size:10px;padding:2px 8px;letter-spacing:1px;margin-bottom:8px;}
.event-card h4{font-size:14px;color:var(--white);margin-bottom:5px;font-weight:700;}
.event-card p{font-size:12px;color:var(--gray);margin-bottom:10px;}
.prog-wrap{background:rgba(255,255,255,.07);border-radius:10px;height:5px;overflow:hidden;margin-bottom:5px;}
.prog-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--neon),var(--neon2));}
.prog-txt{font-size:10px;color:var(--gray);margin-bottom:10px;}
.btn-ev{background:transparent;border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--white);font-family:'Rajdhani',sans-serif;font-size:12px;padding:7px 14px;cursor:pointer;letter-spacing:1px;transition:all .2s;}
.btn-ev:hover{background:rgba(255,107,53,.1);border-color:var(--neon);}

/* FAQ */
.faq-item{border-bottom:1px solid rgba(255,107,53,.1);}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:14px 0;cursor:pointer;user-select:none;}
.faq-q h4{font-size:13px;color:var(--white);font-weight:600;padding-right:10px;}
.faq-ico{color:var(--neon);font-size:18px;transition:transform .25s;flex-shrink:0;}
.faq-item.open .faq-ico{transform:rotate(45deg);}
.faq-ans{font-size:12px;color:var(--gray);padding:0 0 14px;display:none;line-height:1.7;}
.faq-item.open .faq-ans{display:block;animation:slideup .25s ease;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(7,9,26,.95);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;align-items:stretch;height:60px;padding-bottom:env(safe-area-inset-bottom);}
.bnav-btn{flex:1;background:none;border:none;color:var(--gray);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all .2s;position:relative;}
.bnav-btn.active{color:var(--neon);}
.bnav-btn.active::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--neon);border-radius:0 0 4px 4px;box-shadow:0 0 8px var(--neon);}
.bnav-icon{font-size:20px;}
.bnav-lbl{font-size:10px;letter-spacing:.5px;font-family:'Rajdhani',sans-serif;}

/* POPUP */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s;}
.popup-overlay.show{opacity:1;pointer-events:all;}
.reward-popup{background:linear-gradient(155deg,#0d1230,#120828);border:2px solid var(--border);border-radius:24px;padding:28px 22px 24px;width:100%;max-width:340px;text-align:center;position:relative;transform:scale(.85) translateY(20px);transition:all .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 60px rgba(255,107,53,.25),inset 0 0 30px rgba(255,107,53,.05);}
.popup-overlay.show .reward-popup{transform:scale(1) translateY(0);}
.rwd-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--gray);font-size:24px;cursor:pointer;line-height:1;transition:all .2s;}
.rwd-close:hover{color:var(--neon);transform:rotate(90deg);}
.rwd-burst{font-size:68px;margin-bottom:8px;animation:burst .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes burst{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rwd-rarity-bar{height:4px;border-radius:4px;margin:0 auto 14px;width:60%;}
.rwd-rarity-legendary{background:linear-gradient(90deg,var(--neon),var(--neon2));box-shadow:0 0 12px var(--neon);}
.rwd-rarity-epic{background:linear-gradient(90deg,#7c3aed,#a78bfa);box-shadow:0 0 12px #7c3aed;}
.rwd-rarity-rare{background:linear-gradient(90deg,#3b82f6,#60a5fa);box-shadow:0 0 12px #3b82f6;}
.rwd-rarity-common{background:linear-gradient(90deg,#6b7280,#9ca3af);}
.rwd-name{font-family:'Orbitron',sans-serif;font-size:17px;color:var(--neon);margin-bottom:6px;text-shadow:0 0 14px var(--neon);}
.rwd-desc{font-size:13px;color:var(--gray);margin-bottom:16px;letter-spacing:.5px;}
.rwd-stats{display:flex;justify-content:center;gap:14px;margin-bottom:18px;}
.rwd-stat{text-align:center;}
.rwd-stat .val{font-family:'Orbitron',sans-serif;font-size:16px;color:var(--neon);}
.rwd-stat .lbl{font-size:10px;color:var(--gray);margin-top:2px;}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(13,18,48,.95);border:1px solid var(--border);border-radius:30px;padding:10px 22px;font-size:13px;color:var(--white);z-index:1000;opacity:0;transition:all .35s;pointer-events:none;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden;box-shadow:0 0 20px rgba(255,107,53,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.toast-ok{border-color:rgba(16,185,129,.5);color:var(--success);}
.toast.toast-err{border-color:rgba(239,68,68,.5)
